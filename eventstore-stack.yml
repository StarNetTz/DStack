version: "3.8"

services:
   eventstore:
    image: eventstore/eventstore:24.10
    volumes:
      - eventstore-data:/var/lib/eventstore
      - eventstore-logs:/var/log/eventstore
    ports:
      - "2113:2113"
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_STATS_PERIOD_SEC=240
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_SKIP_DB_VERIFY=True
      - EVENTSTORE_SKIP_INDEX_VERIFY=True
      - EVENTSTORE_INT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_CLUSTER_GOSSIP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    healthcheck:
      disable: true
    networks:
      - eventstore-network
    deploy:
      replicas: 1

   kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb
    ports:
      - "2114:2113"
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_NODE_PORT=2113
      - KURRENTDB_INSECURE=true
      - KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true
    networks:
      - eventstore-network
    deploy:
      replicas: 1

networks:
  eventstore-network:

volumes:
  eventstore-data:
  eventstore-logs:
  kurrentdb-data:
  kurrentdb-logs:
  